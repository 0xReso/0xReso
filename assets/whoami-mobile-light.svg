      <defs><clipPath id="cmdrev-0"><rect x="18" y="-15" width="54" height="30"><animate attributeName="width" values="0;9;18;27;36;45;54" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333;1.0000" calcMode="discrete" begin="0ms" dur="500ms" fill="freeze"/></rect></clipPath></defs>
      <text class="tt fade-in" style="animation-delay: 0ms" fill="#1D9BF0" textLength="18" lengthAdjust="spacingAndGlyphs">$ </text>
      <text class="tt" x="18" fill="#1D9BF0" textLength="54" lengthAdjust="spacingAndGlyphs" clip-path="url(#cmdrev-0)">whoami</text>
      
    <rect x="18" y="-13" width="9" height="15"

      <animate attributeName="opacity" from="0" to="1" begin="0ms" dur="10ms" fill="freeze"/>
      <animate attributeName="opacity" to="0" begin="500ms" dur="10ms" fill="freeze"/>
      <animate attributeName="x" values="18;18;27;36;45;54;63" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333;1.0000" calcMode="discrete" begin="0ms" dur="500ms" fill="freeze"/>
    </rect>
    </g>

    <g transform="translate(0, 22.5)" class="fade-in" style="animation-delay: 620ms">

<svg width="920" height="300" viewBox="0 0 920 300" xmlns="http://www.w3.org/2000/svg"
  role="img" aria-label="Animated terminal showing: whoami">
  <title>Animated terminal showing: whoami</title>
  <desc>reso@github:~$ whoami
name      Ayush
handle    @0xReso
role      Associate Data Scientist
now       Data Science &amp; Innovation, Jul&apos;26–present
builds    production data pipelines and agentic analytics systems
before    Data Science Intern, Jan&apos;26–Jun&apos;26
edu       B.Tech CSE, Delhi Technological University, 2022–2026, CGPA 8.36/10</desc>
  <style>
    .tt { font-family: JetBrains Mono, Fira Code, Ubuntu Mono, Consolas, Monaco, monospace; font-size: 16px; white-space: pre; }
    @keyframes scanlineScroll {
      from { transform: translateY(0); }
      to { transform: translateY(4px); }
    }
    .scanline-overlay { animation: scanlineScroll 1.2s linear infinite; }
    /* fadeIn drives all opacity fade-ins (prompt + output lines + animated frame
       wrappers). Lives in CSS rather than SMIL so the @media block below kills
       it under prefers-reduced-motion. fill-mode: backwards keeps the element
       at opacity 0 during the animation-delay window so it doesn't pop in
       before its scheduled time. */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fadeIn 10ms linear backwards; }
    /* frame-cycle-N (closes #69): one rule per unique frame count across the
       animated blocks in this render. Each frame text element carries the
       class + an inline animation-delay = i*frameDur. The static opacity
       attribute (frame 0 = 1, others = 0) is the SMIL-stripped AND
       reduced-motion fallback — frame 0 visible, rest invisible. Under
       prefers-reduced-motion the @media block kills animation-duration so
       the underlying opacity attribute applies. */

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <defs>
    
    
    <clipPath id="terminalViewport">
      <rect x="0" y="40" width="920" height="260"/>
    </clipPath>
  </defs>

  <g>
    
    <rect x="0" y="0" width="920" height="300"
          rx="12" ry="12"
          fill="#000000"/>
    
    <rect x="0" y="0" width="920" height="40"
          rx="12" ry="12"
          fill="#171717"/>
    <rect x="0" y="16" width="920" height="16"
          fill="#171717"/>
    <g id="window-controls">
      <circle cx="24" cy="16" r="6" fill="#ff5f57" stroke="rgba(0,0,0,0.18)" stroke-width="0.5"/>
      <circle cx="44" cy="16" r="6" fill="#ffbd2e" stroke="rgba(0,0,0,0.18)" stroke-width="0.5"/>
      <circle cx="64" cy="16" r="6" fill="#28ca42" stroke="rgba(0,0,0,0.18)" stroke-width="0.5"/>
    </g>
    <text x="460" y="24.55"
          font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif" font-size="13"
          fill="#ffffff" text-anchor="middle">
      reso@github:~
    </text>
    
    <rect x="0" y="40" width="920"
          height="260" fill="#000000"/>
    <g clip-path="url(#terminalViewport)">
      <g id="scrollContainer" transform="translate(22, 54)">
        
        
    <g transform="translate(0, 0)">
      <defs><clipPath id="cmdrev-0"><rect x="144" y="-16" width="60" height="32"><animate attributeName="width" values="0;10;20;30;40;50;60" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333;1.0000" calcMode="discrete" begin="0ms" dur="500ms" fill="freeze"/></rect></clipPath></defs>
      <text class="tt fade-in" style="animation-delay: 0ms" fill="#6ae4b9" textLength="144" lengthAdjust="spacingAndGlyphs">reso@github:~$ </text>
      <text class="tt" x="144" fill="#6ae4b9" textLength="60" lengthAdjust="spacingAndGlyphs" clip-path="url(#cmdrev-0)">whoami</text>
      
    <rect x="144" y="-14" width="10" height="16"
          fill="#ffffff" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0ms" dur="10ms" fill="freeze"/>
      <animate attributeName="opacity" to="0" begin="500ms" dur="10ms" fill="freeze"/>
      <animate attributeName="x" values="144;144;154;164;174;184;194" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333;1.0000" calcMode="discrete" begin="0ms" dur="500ms" fill="freeze"/>
    </rect>
    </g>

    <g transform="translate(0, 24.8)" class="fade-in" style="animation-delay: 660ms">
      <text class="tt"><tspan fill="#00d3d0">name</tspan><tspan fill="#ffffff">      Ayush</tspan></text>
    </g>

    <g transform="translate(0, 49.6)" class="fade-in" style="animation-delay: 710ms">
      <text class="tt"><tspan fill="#00d3d0">handle</tspan><tspan fill="#ffffff">    @0xReso</tspan></text>
    </g>

    <g transform="translate(0, 74.4)" class="fade-in" style="animation-delay: 760ms">
      <text class="tt"><tspan fill="#00d3d0">role</tspan><tspan fill="#ffffff">      Associate Data Scientist</tspan></text>
    </g>

    <g transform="translate(0, 99.2)" class="fade-in" style="animation-delay: 810ms">
      <text class="tt"><tspan fill="#00d3d0">now</tspan><tspan fill="#ffffff">       Data Science &amp; Innovation, Jul&apos;26–present</tspan></text>
    </g>

    <g transform="translate(0, 124)" class="fade-in" style="animation-delay: 860ms">
      <text class="tt"><tspan fill="#00d3d0">builds</tspan><tspan fill="#ffffff">    production data pipelines and agentic analytics systems</tspan></text>
    </g>

    <g transform="translate(0, 148.8)" class="fade-in" style="animation-delay: 910ms">
      <text class="tt"><tspan fill="#00d3d0">before</tspan><tspan fill="#ffffff">    Data Science Intern, Jan&apos;26–Jun&apos;26</tspan></text>
    </g>

    <g transform="translate(0, 173.6)" class="fade-in" style="animation-delay: 960ms">
      <text class="tt"><tspan fill="#00d3d0">edu</tspan><tspan fill="#ffffff">       B.Tech CSE, Delhi Technological University, 2022–2026, CGPA 8.36/10</tspan></text>
    </g>
      </g>
    </g>
    
    
  </g>
</svg>
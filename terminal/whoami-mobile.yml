# $ whoami — narrow layout. Light variant uses theme: github-light.
theme: modus-vivendi

window:
  title: "whoami"
  width: 420
  style: macos
  autoHeight: true

terminal:
  fontSize: 15
  lineHeight: 1.5
  prompt: "$ "
  padding: 16

effects:
  textGlow: false
  scanlines: false
  vignette: false
  shadow: false

animation:
  loop: false
  defaultTypingDuration: 500
  outputLineStagger: 40
  commandOutputPause: 120
  outputEndPause: 40

accessibility:
  describe: true

blocks:
  - block: custom
    typing: fast
    config:
      command: whoami
      lines:
        - "[[fg:cyan]]Ayush[[/fg]] · @0xReso"
        - "Associate Data Scientist"
        - "Data Science & Innovation"
        - "Jul'26–present"
        - "production data pipelines"
        - "and agentic analytics systems"
        - "Data Science Intern, Jan'26–Jun'26"
        - "B.Tech CSE, DTU, 2022–2026, 8.36/10"

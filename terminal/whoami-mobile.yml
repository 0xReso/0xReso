# $ whoami — narrow layout. Light frames swap text and background, and use #0A74B8 for accent text and lines.
theme:
  name: sky
  colors:
    text: "#ffffff"
    comment: "#ffffff"
    background: "#000000"
    titleBarBackground: "#000000"
    titleBarText: "#ffffff"
    prompt: "#1D9BF0"
    cursor: "#1D9BF0"
    red: "#1D9BF0"
    green: "#1D9BF0"
    yellow: "#1D9BF0"
    blue: "#1D9BF0"
    magenta: "#1D9BF0"
    cyan: "#1D9BF0"
    white: "#ffffff"
    orange: "#1D9BF0"
    purple: "#1D9BF0"
    pink: "#1D9BF0"
    brightRed: "#1D9BF0"
    brightGreen: "#1D9BF0"
    brightYellow: "#1D9BF0"
    brightBlue: "#1D9BF0"
    brightMagenta: "#1D9BF0"
    brightCyan: "#1D9BF0"
    brightWhite: "#ffffff"
    brightBlack: "#000000"
  buttons:
    close: "#1D9BF0"
    minimize: "#1D9BF0"
    maximize: "#1D9BF0"

window:
  title: "whoami"
  width: 420
  style: macos
  autoHeight: true

terminal:
  fontSize: 15
  lineHeight: 1.5
  prompt: "$ "
  padding: 16

effects:
  textGlow: false
  scanlines: false
  vignette: false
  shadow: false

animation:
  loop: false
  defaultTypingDuration: 500
  outputLineStagger: 40
  commandOutputPause: 120
  outputEndPause: 40

accessibility:
  describe: true

blocks:
  - block: custom
    typing: fast
    config:
      command: whoami
      lines:
        - "[[fg:cyan]]Ayush[[/fg]] · @0xReso"
        - "Data and agent engineer"
        - "New Delhi"
        - "data pipelines and"
        - "agentic analytics tools"
        - "B.Tech CSE, DTU '26"
        - "medium.com/@0xReso"
        - "0xreso.github.io/upskiller-notes"

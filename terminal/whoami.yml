# $ whoami — desktop. Light frames swap text and background to black on white.
theme:
  name: sky
  colors:
    text: "#ffffff"
    comment: "#ffffff"
    background: "#000000"
    titleBarBackground: "#000000"
    titleBarText: "#ffffff"
    prompt: "#1D9BF0"
    cursor: "#1D9BF0"
    red: "#1D9BF0"
    green: "#1D9BF0"
    yellow: "#1D9BF0"
    blue: "#1D9BF0"
    magenta: "#1D9BF0"
    cyan: "#1D9BF0"
    white: "#ffffff"
    orange: "#1D9BF0"
    purple: "#1D9BF0"
    pink: "#1D9BF0"
    brightRed: "#1D9BF0"
    brightGreen: "#1D9BF0"
    brightYellow: "#1D9BF0"
    brightBlue: "#1D9BF0"
    brightMagenta: "#1D9BF0"
    brightCyan: "#1D9BF0"
    brightWhite: "#ffffff"
    brightBlack: "#000000"
  buttons:
    close: "#1D9BF0"
    minimize: "#1D9BF0"
    maximize: "#1D9BF0"

window:
  title: "reso@github:~"
  width: 920
  style: macos
  autoHeight: true

terminal:
  fontSize: 16
  lineHeight: 1.55
  prompt: "reso@github:~$ "
  padding: 22

effects:
  textGlow: false
  scanlines: false
  vignette: false
  shadow: false

animation:
  loop: false
  defaultTypingDuration: 700
  outputLineStagger: 50
  commandOutputPause: 160
  outputEndPause: 60

accessibility:
  describe: true

blocks:
  - block: custom
    typing: fast
    config:
      command: whoami
      lines:
        - "[[fg:cyan]]name[[/fg]]      Ayush"
        - "[[fg:cyan]]handle[[/fg]]    @0xReso"
        - "[[fg:cyan]]role[[/fg]]      Associate Data Scientist"
        - "[[fg:cyan]]now[[/fg]]       Data Science & Innovation, Jul'26–present"
        - "[[fg:cyan]]builds[[/fg]]    production data pipelines and agentic analytics systems"
        - "[[fg:cyan]]before[[/fg]]    Data Science Intern, Jan'26–Jun'26"
        - "[[fg:cyan]]edu[[/fg]]       B.Tech CSE, Delhi Technological University, 2022–2026, CGPA 8.36/10"

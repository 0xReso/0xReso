# $ cat wins.log — desktop fastfetch-style block. Light variant: theme github-light.
theme: modus-vivendi

window:
  title: "reso@github:~"
  width: 920
  style: macos
  autoHeight: true

terminal:
  fontSize: 16
  lineHeight: 1.5
  prompt: "reso@github:~$ "
  padding: 22

effects:
  textGlow: false
  scanlines: false
  vignette: false
  shadow: false

animation:
  loop: false
  defaultTypingDuration: 600
  outputLineStagger: 36
  commandOutputPause: 140
  outputEndPause: 40

accessibility:
  describe: true

blocks:
  - block: custom
    typing: fast
    config:
      command: cat wins.log
      lines:
        - "[[fg:cyan]]stores[[/fg]]      2,400+ covered by the agentic bot"
        - "[[fg:cyan]]tools[[/fg]]       14 typed tools"
        - "[[fg:cyan]]csat[[/fg]]        78 lakh CSAT"
        - "[[fg:cyan]]ors[[/fg]]         3.82 lakh ORS"
        - "[[fg:cyan]]reviews[[/fg]]     1.42 lakh Google reviews"
        - "[[fg:cyan]]impact[[/fg]]      estimated impact of ₹3.5 Cr+"
        - "[[fg:cyan]]leetcode[[/fg]]    Knight (1857), 350+ problems"
        - "[[fg:cyan]]codeforces[[/fg]]  Specialist (1471)"
        - "[[fg:cyan]]codechef[[/fg]]    4-star (1800+)"
        - "[[fg:cyan]]jee[[/fg]]         Advanced 2022 AIR 10104; Mains 2022 AIR 6742"
        - "[[fg:cyan]]hackathon[[/fg]]   Runner-up in the company's internal hackathon (2nd place)"

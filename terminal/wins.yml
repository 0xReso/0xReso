# $ cat wins.log — desktop. Technical figures only. Light frames use #0A74B8 for accent text and lines.
theme:
  name: sky
  colors:
    text: "#ffffff"
    comment: "#ffffff"
    background: "#000000"
    titleBarBackground: "#000000"
    titleBarText: "#ffffff"
    prompt: "#1D9BF0"
    cursor: "#1D9BF0"
    red: "#1D9BF0"
    green: "#1D9BF0"
    yellow: "#1D9BF0"
    blue: "#1D9BF0"
    magenta: "#1D9BF0"
    cyan: "#1D9BF0"
    white: "#ffffff"
    orange: "#1D9BF0"
    purple: "#1D9BF0"
    pink: "#1D9BF0"
    brightRed: "#1D9BF0"
    brightGreen: "#1D9BF0"
    brightYellow: "#1D9BF0"
    brightBlue: "#1D9BF0"
    brightMagenta: "#1D9BF0"
    brightCyan: "#1D9BF0"
    brightWhite: "#ffffff"
    brightBlack: "#000000"
  buttons:
    close: "#1D9BF0"
    minimize: "#1D9BF0"
    maximize: "#1D9BF0"

window:
  title: "reso@github:~"
  width: 920
  style: macos
  autoHeight: true

terminal:
  fontSize: 16
  lineHeight: 1.5
  prompt: "reso@github:~$ "
  padding: 22

effects:
  textGlow: false
  scanlines: false
  vignette: false
  shadow: false

animation:
  loop: false
  defaultTypingDuration: 600
  outputLineStagger: 36
  commandOutputPause: 140
  outputEndPause: 40

accessibility:
  describe: true

blocks:
  - block: custom
    typing: fast
    config:
      command: cat wins.log
      lines:
        - "[[fg:cyan]]tools[[/fg]]     14 typed tools"
        - "[[fg:cyan]]outlets[[/fg]]   2,400+"
        - "[[fg:cyan]]records[[/fg]]   8.3M+ customer records"
        - "[[fg:cyan]]refresh[[/fg]]   weekly"
